[package]
name = "skesis"
version = "0.2.0"
edition = "2024"
description = "A high-performance Entity Component System with anchor+delta change detection, relationships, and raw byte serialization"
license = "MIT OR Apache-2.0"
repository = "https://github.com/madmax983/skesis"
keywords = ["ecs", "gamedev", "entity-component", "change-detection"]
categories = ["game-development", "data-structures"]
readme = "README.md"

[workspace]
members = [".", "skesis-macros"]

[features]
default = ["macros"]
macros = ["dep:skesis-macros"]

[dependencies]
rayon = "1"
skesis-macros = { path = "skesis-macros", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "micro"
harness = false
